workflows:
  android-2net-test:
    name: 2NET Rastreamento - Teste Android
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Flutter version
        script: |
          flutter --version

      - name: Install dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
